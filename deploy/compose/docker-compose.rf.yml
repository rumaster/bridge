# Bridge — Edge Cluster (РФ), для развёртывания на отдельном сервере,
# физически размещённом в России (152-ФЗ, требования к локализации данных).
#
# Поднимает только то, что относится к РФ-периметру:
#   - postgres-rf — резидентный Postgres для буфера edge-сообщений;
#   - migrate-rf — миграции только RF-схемы (edge_message_buffer);
#   - edge-gateway — WebSocket-шлюз/Edge Cluster, принимающий сообщения клиентов
#     в РФ, фиксирующий их в RF-буфере и отправляющий в Application Cluster через
#     VPN Tunnel Service.
#
# Не входит и намеренно не создаётся в этом файле:
#   - App-сторона VPN Tunnel Service: она запускается в Application Cluster через
#     сервис edge-vpn-app из docker-compose.yml. RF edge-gateway подключается к
#     ней по EDGE_VPN_APP_TCP_URL, а при отказе основного TCP/TLS-транспорта — по
#     EDGE_VPN_APP_WSS_URL.
#   - миграции Application Cluster: против postgres-rf выполняется только
#     цель "rf" скрипта scripts/db-migrate.ts, без мультитенантной SaaS-схемы.
#
# Этот файл полностью независим от deploy/compose/docker-compose.yml
# (Application Cluster) и запускается отдельно, на своём сервере:
#   cp .env.rf.example .env.rf
#   docker compose --env-file .env.rf -f deploy/compose/docker-compose.rf.yml up --build

name: bridge-edge-rf

services:
  postgres-rf:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_RF_USER:-bridge_edge}
      POSTGRES_PASSWORD: ${POSTGRES_RF_PASSWORD:-bridge_edge}
      POSTGRES_DB: ${POSTGRES_RF_DB:-bridge_edge}
    ports:
      - "${POSTGRES_RF_PORT:-5433}:5432"
    volumes:
      - bridge-edge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_RF_USER:-bridge_edge} -d ${POSTGRES_RF_DB:-bridge_edge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate-rf:
    build:
      context: ../..
      dockerfile: deploy/docker/db-tools/Dockerfile
    environment:
      DATABASE_URL: ${RF_DATABASE_URL:-postgres://bridge_edge:bridge_edge@postgres-rf:5432/bridge_edge}
      DB_MIGRATE_VERBOSE: ${DB_MIGRATE_VERBOSE:-0}
    depends_on:
      postgres-rf:
        condition: service_healthy
    command: ["node", "--import", "tsx", "scripts/db-migrate.ts", "up", "rf"]

  edge-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/edge-gateway/Dockerfile
    restart: unless-stopped
    environment:
      # В коде edge-gateway хост по умолчанию 127.0.0.1 — переопределяем на
      # 0.0.0.0, иначе сервис недоступен снаружи контейнера.
      EDGE_GATEWAY_MODE: ${EDGE_GATEWAY_MODE:-edge}
      HOST: 0.0.0.0
      PORT: ${EDGE_GATEWAY_PORT:-3000}
      DATABASE_URL: ${RF_DATABASE_URL:-postgres://bridge_edge:bridge_edge@postgres-rf:5432/bridge_edge}
      EDGE_BUFFER_ENCRYPTION_KEY: ${EDGE_BUFFER_ENCRYPTION_KEY:?укажите EDGE_BUFFER_ENCRYPTION_KEY в .env.rf}
      EDGE_VPN_SESSION_KEY: ${EDGE_VPN_SESSION_KEY:?укажите EDGE_VPN_SESSION_KEY в .env.rf}
      EDGE_VPN_EDGE_ID: ${EDGE_VPN_EDGE_ID:-edge-rf}
      EDGE_VPN_EDGE_CERT: ${EDGE_VPN_EDGE_CERT:?укажите EDGE_VPN_EDGE_CERT в .env.rf}
      EDGE_VPN_TRUSTED_APP_CERTS: ${EDGE_VPN_TRUSTED_APP_CERTS:?укажите EDGE_VPN_TRUSTED_APP_CERTS в .env.rf}
      EDGE_VPN_APP_TCP_URL: ${EDGE_VPN_APP_TCP_URL:?укажите EDGE_VPN_APP_TCP_URL в .env.rf}
      EDGE_VPN_APP_WSS_URL: ${EDGE_VPN_APP_WSS_URL:-}
      # Единый слой (Этап 2, Q2): off снимает прикладной AES-GCM/mTLS (защита — на
      # AmneziaWG). Проактивный liveness (§5.4): on включает активную TCP-пробу
      # туннельного IP App-стороны как триггер «буферизация ↔ дренаж». Туннельный
      # деплой ставит off/on (см. .env.awg.rf); дефолты сохраняют прежнее поведение.
      EDGE_VPN_APP_CRYPTO: ${EDGE_VPN_APP_CRYPTO:-on}
      EDGE_VPN_TUNNEL_LIVENESS: ${EDGE_VPN_TUNNEL_LIVENESS:-off}
      EDGE_VPN_LIVENESS_INTERVAL_MS: ${EDGE_VPN_LIVENESS_INTERVAL_MS:-5000}
      EDGE_VPN_LIVENESS_TIMEOUT_MS: ${EDGE_VPN_LIVENESS_TIMEOUT_MS:-2000}
      EDGE_VPN_TIMEOUT_MS: ${EDGE_VPN_TIMEOUT_MS:-5000}
      EDGE_VPN_BACKOFF_MS: ${EDGE_VPN_BACKOFF_MS:-100,500,1000,2500,5000}
      EDGE_BUFFER_TTL_MS: ${EDGE_BUFFER_TTL_MS:-3600000}
      # Канал MAX на Edge (edge-owned, docs/plan/max-channel-production.md).
      # EDGE_CHANNEL_DRIVERS=on поднимает control-plane + входящий MAX-драйвер на
      # Edge (Этап M5); off (по умолчанию) — поведение edge не меняется.
      EDGE_CHANNEL_DRIVERS: ${EDGE_CHANNEL_DRIVERS:-off}
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://botapi.max.ru}
      MAX_INBOUND_POLL_TIMEOUT_SECONDS: ${MAX_INBOUND_POLL_TIMEOUT_SECONDS:-30}
      MAX_INBOUND_REFRESH_INTERVAL_MS: ${MAX_INBOUND_REFRESH_INTERVAL_MS:-30000}
      # Email-драйверы на Edge (Этап M1, docs/plan/mail-service-selfhosted.md).
      # Активируются вместе с EDGE_CHANNEL_DRIVERS=on. TLS_REJECT_UNAUTHORIZED=0 —
      # принимать self-signed сертификат почтовика внутри docker-сети (M1).
      EMAIL_TLS_REJECT_UNAUTHORIZED: ${EMAIL_TLS_REJECT_UNAUTHORIZED:-1}
      EMAIL_INBOUND_POLL_INTERVAL_MS: ${EMAIL_INBOUND_POLL_INTERVAL_MS:-15000}
      EMAIL_INBOUND_REFRESH_INTERVAL_MS: ${EMAIL_INBOUND_REFRESH_INTERVAL_MS:-30000}
      EDGE_VPN_APP_TCP_CLIENT_TLS_CA: ${EDGE_VPN_APP_TCP_CLIENT_TLS_CA:-}
      EDGE_VPN_APP_TCP_CLIENT_TLS_KEY: ${EDGE_VPN_APP_TCP_CLIENT_TLS_KEY:-}
      EDGE_VPN_APP_TCP_CLIENT_TLS_CERT: ${EDGE_VPN_APP_TCP_CLIENT_TLS_CERT:-}
      EDGE_VPN_APP_WSS_CLIENT_TLS_CA: ${EDGE_VPN_APP_WSS_CLIENT_TLS_CA:-}
      EDGE_VPN_APP_WSS_CLIENT_TLS_KEY: ${EDGE_VPN_APP_WSS_CLIENT_TLS_KEY:-}
      EDGE_VPN_APP_WSS_CLIENT_TLS_CERT: ${EDGE_VPN_APP_WSS_CLIENT_TLS_CERT:-}
    ports:
      - "${EDGE_GATEWAY_PORT:-3000}:${EDGE_GATEWAY_PORT:-3000}"
    # Резолв публичного UDP-эндпоинта App-стороны на одном хосте (стенд): позволяет
    # AWG_ENDPOINT=host.docker.internal:51820. В проде AWG_ENDPOINT — публичный
    # DNS/IP App-кластера, и этот alias не используется.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate-rf:
        condition: service_completed_successfully

  # AmneziaWG-инициатор Edge-стороны (issue #257, Этап 1). Поднимает awg0
  # (10.7.0.2) внутри network namespace edge-gateway: нода сохраняет свою
  # идентичность/порт 3000, а исходящий C9 на туннельный IP App-стороны
  # (EDGE_VPN_APP_TCP_URL=tcp://10.7.0.1:3049) идёт ВНУТРИ туннеля. Здесь живёт
  # обфускация Jc/S*/I* (§2 плана). Профиль tunnel — чтобы Edge поднимался и без
  # туннеля (тогда EDGE_VPN_APP_TCP_URL указывает на App по сети, как раньше).
  awg-client:
    profiles: ["tunnel"]
    build:
      context: ../..
      dockerfile: deploy/docker/awg/Dockerfile
      args:
        AWG_GO_REF: ${AWG_GO_REF:-master}
        AWG_TOOLS_REF: ${AWG_TOOLS_REF:-master}
    restart: unless-stopped
    network_mode: "service:edge-gateway"
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      AWG_INTERFACE: awg0
      AWG_ADDRESS: ${AWG_CLIENT_ADDRESS:-10.7.0.2/24}
      AWG_MTU: ${AWG_MTU:-1380}
      AWG_PRIVATE_KEY: ${AWG_CLIENT_PRIVATE_KEY:-}
      AWG_PEER_PUBLIC_KEY: ${AWG_SERVER_PUBLIC_KEY:-}
      AWG_PEER_PRESHARED_KEY: ${AWG_PRESHARED_KEY:-}
      AWG_PEER_ALLOWED_IPS: ${AWG_SERVER_ADDRESS_CIDR:-10.7.0.1/32}
      # Публичный UDP-эндпоинт App-стороны (awg-server). На стенде —
      # host.docker.internal:51820, в проде — публичный DNS App-кластера.
      AWG_ENDPOINT: ${AWG_ENDPOINT:-host.docker.internal:51820}
      AWG_PERSISTENT_KEEPALIVE: ${AWG_PERSISTENT_KEEPALIVE:-25}
      # Prometheus-экспортер awg (Этап 3): скрейпится по адресу ноды (общий
      # namespace) — edge-gateway:${AWG_METRICS_PORT}.
      AWG_METRICS_PORT: ${AWG_METRICS_PORT:-9586}
      # Обфускация — значима на клиенте-инициаторе (§2 плана).
      AWG_JC: ${AWG_JC:-6}
      AWG_JMIN: ${AWG_JMIN:-40}
      AWG_JMAX: ${AWG_JMAX:-70}
      AWG_S1: ${AWG_S1:-0}
      AWG_S2: ${AWG_S2:-0}
      AWG_H1: ${AWG_H1:-}
      AWG_H2: ${AWG_H2:-}
      AWG_H3: ${AWG_H3:-}
      AWG_H4: ${AWG_H4:-}
    depends_on:
      edge-gateway:
        condition: service_started

  # Смежная услуга: self-hosted почтовый сервер (docs/plan/mail-service-selfhosted.md).
  # Профиль `mail` опционален (по умолчанию выключен — RF-кластер поднимается как
  # раньше). M1: тест-мишень для edge email-драйверов — edge-gateway ходит по
  # IMAP/SMTP на имя `mailserver` внутри docker-сети RF-кластера. M3+: боевая
  # доставка (DKIM/SPF/DMARC/PTR настраиваются при развёртывании).
  #
  # Первичная инициализация (после `up`): завести ящики на настраиваемом домене
  #   docker compose --env-file .env.rf -f deploy/compose/docker-compose.rf.yml \
  #     exec mailserver setup email add support@${MAIL_DOMAIN} '<пароль>'
  # Конфиг/аккаунты персистятся в deploy/mail/config (bind mount).
  mailserver:
    profiles: ["mail"]
    image: ghcr.io/docker-mailserver/docker-mailserver:${MAIL_IMAGE_TAG:-latest}
    hostname: ${MAIL_HOSTNAME:-mail.bridge.local}
    restart: unless-stopped
    environment:
      # M1 (тест): антиспам/антивирус/DKIM выключены для скорости; TLS —
      # self-signed внутри docker-сети. M3 включает RSPAMD/OPENDKIM/OPENDMARC и
      # SSL_TYPE=letsencrypt (см. .env.rf.example и план §5.M3).
      ENABLE_RSPAMD: ${MAIL_ENABLE_RSPAMD:-0}
      ENABLE_CLAMAV: ${MAIL_ENABLE_CLAMAV:-0}
      ENABLE_AMAVIS: ${MAIL_ENABLE_AMAVIS:-0}
      ENABLE_SPAMASSASSIN: 0
      ENABLE_OPENDKIM: ${MAIL_ENABLE_OPENDKIM:-0}
      ENABLE_OPENDMARC: ${MAIL_ENABLE_OPENDMARC:-0}
      ENABLE_FAIL2BAN: ${MAIL_ENABLE_FAIL2BAN:-0}
      SSL_TYPE: ${MAIL_SSL_TYPE:-}
      # Разрешить SMTP-приём от контейнеров docker-сети (edge-gateway) без SASL.
      PERMIT_DOCKER: ${MAIL_PERMIT_DOCKER:-connected-networks}
      POSTMASTER_ADDRESS: ${MAIL_POSTMASTER:-postmaster@bridge.local}
      LOG_LEVEL: ${MAIL_LOG_LEVEL:-info}
      # Ротация внутренних логов почтовика (Этап M4). Значения docker-mailserver:
      # daily|weekly|monthly; LOGROTATE_COUNT — сколько ротаций хранить.
      LOGROTATE_INTERVAL: ${MAIL_LOGROTATE_INTERVAL:-weekly}
      LOGROTATE_COUNT: ${MAIL_LOGROTATE_COUNT:-4}
      ONE_DIR: 1
    volumes:
      - bridge-mail-data:/var/mail
      - bridge-mail-state:/var/mail-state
      - bridge-mail-logs:/var/log/mail
      - ../mail/config/:/tmp/docker-mailserver/
    cap_add:
      - NET_ADMIN
    # Публикация на host-порты (высокие, чтобы не конфликтовать) — для отладки/
    # проверки со стенда; edge-gateway всё равно ходит по имени mailserver.
    # M1 без SSL_TYPE поднимает только STARTTLS-порты 143(IMAP)/587(submission);
    # implicit-TLS 993/465 появляются при SSL_TYPE (M3) — тогда добавить их сюда.
    ports:
      - "${MAIL_SMTP_HOST_PORT:-1587}:587"
      - "${MAIL_IMAP_HOST_PORT:-1143}:143"

volumes:
  bridge-edge-postgres-data:
  bridge-mail-data:
  bridge-mail-state:
  bridge-mail-logs:
