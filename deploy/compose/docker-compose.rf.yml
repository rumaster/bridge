# Bridge — Edge Cluster (РФ), для развёртывания на отдельном сервере,
# физически размещённом в России (152-ФЗ, требования к локализации данных).
#
# Поднимает только то, что относится к РФ-периметру:
#   - postgres-rf — резидентный Postgres для буфера edge-сообщений;
#   - migrate-rf — миграции только RF-схемы (edge_message_buffer);
#   - edge-gateway — WebSocket-шлюз/Edge Cluster, принимающий сообщения клиентов
#     в РФ, фиксирующий их в RF-буфере и отправляющий в Application Cluster через
#     VPN Tunnel Service.
#
# Не входит и намеренно не создаётся в этом файле:
#   - App-сторона VPN Tunnel Service: она запускается в Application Cluster через
#     сервис edge-vpn-app из docker-compose.yml. RF edge-gateway подключается к
#     ней по EDGE_VPN_APP_TCP_URL, а при отказе основного TCP/TLS-транспорта — по
#     EDGE_VPN_APP_WSS_URL.
#   - миграции Application Cluster: против postgres-rf выполняется только
#     цель "rf" скрипта scripts/db-migrate.ts, без мультитенантной SaaS-схемы.
#
# Этот файл полностью независим от deploy/compose/docker-compose.yml
# (Application Cluster) и запускается отдельно, на своём сервере:
#   cp .env.rf.example .env.rf
#   docker compose --env-file .env.rf -f deploy/compose/docker-compose.rf.yml up --build

name: bridge-edge-rf

services:
  postgres-rf:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_RF_USER:-bridge_edge}
      POSTGRES_PASSWORD: ${POSTGRES_RF_PASSWORD:-bridge_edge}
      POSTGRES_DB: ${POSTGRES_RF_DB:-bridge_edge}
    ports:
      - "${POSTGRES_RF_PORT:-5433}:5432"
    volumes:
      - bridge-edge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_RF_USER:-bridge_edge} -d ${POSTGRES_RF_DB:-bridge_edge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate-rf:
    build:
      context: ../..
      dockerfile: deploy/docker/db-tools/Dockerfile
    environment:
      DATABASE_URL: ${RF_DATABASE_URL:-postgres://bridge_edge:bridge_edge@postgres-rf:5432/bridge_edge}
      DB_MIGRATE_VERBOSE: ${DB_MIGRATE_VERBOSE:-0}
    depends_on:
      postgres-rf:
        condition: service_healthy
    command: ["node", "--import", "tsx", "scripts/db-migrate.ts", "up", "rf"]

  edge-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/edge-gateway/Dockerfile
    restart: unless-stopped
    environment:
      # В коде edge-gateway хост по умолчанию 127.0.0.1 — переопределяем на
      # 0.0.0.0, иначе сервис недоступен снаружи контейнера.
      EDGE_GATEWAY_MODE: ${EDGE_GATEWAY_MODE:-edge}
      HOST: 0.0.0.0
      PORT: ${EDGE_GATEWAY_PORT:-3000}
      DATABASE_URL: ${RF_DATABASE_URL:-postgres://bridge_edge:bridge_edge@postgres-rf:5432/bridge_edge}
      EDGE_BUFFER_ENCRYPTION_KEY: ${EDGE_BUFFER_ENCRYPTION_KEY:?укажите EDGE_BUFFER_ENCRYPTION_KEY в .env.rf}
      EDGE_VPN_SESSION_KEY: ${EDGE_VPN_SESSION_KEY:?укажите EDGE_VPN_SESSION_KEY в .env.rf}
      EDGE_VPN_EDGE_ID: ${EDGE_VPN_EDGE_ID:-edge-rf}
      EDGE_VPN_EDGE_CERT: ${EDGE_VPN_EDGE_CERT:?укажите EDGE_VPN_EDGE_CERT в .env.rf}
      EDGE_VPN_TRUSTED_APP_CERTS: ${EDGE_VPN_TRUSTED_APP_CERTS:?укажите EDGE_VPN_TRUSTED_APP_CERTS в .env.rf}
      EDGE_VPN_APP_TCP_URL: ${EDGE_VPN_APP_TCP_URL:?укажите EDGE_VPN_APP_TCP_URL в .env.rf}
      EDGE_VPN_APP_WSS_URL: ${EDGE_VPN_APP_WSS_URL:-}
      EDGE_VPN_TIMEOUT_MS: ${EDGE_VPN_TIMEOUT_MS:-5000}
      EDGE_VPN_BACKOFF_MS: ${EDGE_VPN_BACKOFF_MS:-100,500,1000,2500,5000}
      EDGE_BUFFER_TTL_MS: ${EDGE_BUFFER_TTL_MS:-3600000}
      EDGE_VPN_APP_TCP_CLIENT_TLS_CA: ${EDGE_VPN_APP_TCP_CLIENT_TLS_CA:-}
      EDGE_VPN_APP_TCP_CLIENT_TLS_KEY: ${EDGE_VPN_APP_TCP_CLIENT_TLS_KEY:-}
      EDGE_VPN_APP_TCP_CLIENT_TLS_CERT: ${EDGE_VPN_APP_TCP_CLIENT_TLS_CERT:-}
      EDGE_VPN_APP_WSS_CLIENT_TLS_CA: ${EDGE_VPN_APP_WSS_CLIENT_TLS_CA:-}
      EDGE_VPN_APP_WSS_CLIENT_TLS_KEY: ${EDGE_VPN_APP_WSS_CLIENT_TLS_KEY:-}
      EDGE_VPN_APP_WSS_CLIENT_TLS_CERT: ${EDGE_VPN_APP_WSS_CLIENT_TLS_CERT:-}
    ports:
      - "${EDGE_GATEWAY_PORT:-3000}:${EDGE_GATEWAY_PORT:-3000}"
    depends_on:
      migrate-rf:
        condition: service_completed_successfully

volumes:
  bridge-edge-postgres-data:
