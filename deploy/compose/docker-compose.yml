# Bridge SaaS — Application Cluster.
#
# Поднимает основную инфраструктуру Bridge SaaS: ядро backend, деградируемые
# сервисы, фронтенды и служебные джобы БД (migrate/seed). Edge-кластер РФ
# (edge-gateway + отдельный резидентный Postgres) поднимается независимо через
# docker-compose.rf.yml — намеренно не входит в этот файл, см. README рядом.
#
# Запуск из корня репозитория (--env-file обязателен: без него docker compose
# ищет .env рядом с этим файлом, в deploy/compose/, а не в корне репозитория):
#   cp .env.example .env
#   docker compose --env-file .env -f deploy/compose/docker-compose.yml up --build
#
# Разовый прогон сидов (после того как migrate завершится успешно):
#   docker compose --env-file .env -f deploy/compose/docker-compose.yml --profile seed up seed
#
# ВАЖНО: переменные *_INGRESS_URL/*_KB_URL/BACKEND_INTERNAL_URL и DATABASE_URL
# ниже заданы как самостоятельные (не вложенные) значения, а не через
# подстановку вида ${BACKEND_PORT}, потому что docker compose ненадёжно
# разворачивает вложенные ${VAR:-${OTHER}}. Если меняете BACKEND_PORT или
# POSTGRES_*, обновите такие URL вручную и в .env.

name: bridge-saas

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridge}
      POSTGRES_DB: ${POSTGRES_DB:-bridge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bridge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridge} -d ${POSTGRES_DB:-bridge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - bridge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/db-tools/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://bridge:bridge@postgres:5432/bridge}
      DB_MIGRATE_VERBOSE: ${DB_MIGRATE_VERBOSE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "--import", "tsx", "scripts/db-migrate.ts", "up"]

  seed:
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: deploy/docker/db-tools/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://bridge:bridge@postgres:5432/bridge}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "--import", "tsx", "scripts/db-seed.ts"]

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://bridge:bridge@postgres:5432/bridge}
      # Секрет хеширования сессий и одноразовых кодов входа. Backend читает
      # AUTH_HASH_SECRET, поэтому пробрасываем сюда значение из BRIDGE_AUTH_SECRET
      # (имя переменной в .env сохранено для обратной совместимости).
      AUTH_HASH_SECRET: ${BRIDGE_AUTH_SECRET:?укажите BRIDGE_AUTH_SECRET в .env, см. .env.example}
      # Токен Telegram-бота для доставки одноразовых кодов входа. Если пусто —
      # код генерируется, но не отправляется (см. .env.example).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      CHANNEL_SECRET_ENCRYPTION_KEY: ${CHANNEL_SECRET_ENCRYPTION_KEY:?укажите CHANNEL_SECRET_ENCRYPTION_KEY в .env, см. .env.example}
      CHANNEL_SECRET_KEY_ID: ${CHANNEL_SECRET_KEY_ID:-env:CHANNEL_SECRET_ENCRYPTION_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_GRPC_TARGET: ${AI_GRPC_TARGET:-ai-platform:3106}
      INTEGRATION_GATEWAY_URL: ${INTEGRATION_GATEWAY_URL:-http://integration-platform:3005}
      FBP_GRPC_TARGET: ${FBP_GRPC_TARGET:-fbp-engine:3105}
      BROADCAST_GRPC_TARGET: ${BROADCAST_GRPC_TARGET:-broadcast-platform:3108}
      NOTIFICATION_GRPC_TARGET: ${NOTIFICATION_GRPC_TARGET:-notification-platform:3110}
      # URL, по которому backend пересылает исходящие сообщения (C2.EgressDelivery)
      # в integration-platform. Пусто — статус фиксируется только в БД (см. .env.example).
      INTEGRATION_EGRESS_URL: ${INTEGRATION_EGRESS_URL:-http://integration-platform:3005/internal/delivery/dispatch}
      # Edge-owned email: при заданном URL исходящие email-сообщения backend
      # диспетчеризует на Edge Gateway control-plane (C9.egress_dispatch → SMTP на
      # Edge), а НЕ в integration-platform. Пусто — email идёт прежним путём.
      # На стенде Edge в отдельном RF-кластере → через host-порт edge-gateway.
      EDGE_CONTROL_URL: ${EDGE_CONTROL_URL:-}
      # Туннельный путь control-plane (Этап E2/MP-12): адрес HTTP-релея на
      # edge-vpn-app. Задан → backend шлёт creds-sync/egress/channel_test сюда, а
      # релей проталкивает их на Edge по VPN-туннелю (приоритетнее EDGE_CONTROL_URL).
      # Пусто → прямой HTTP на EDGE_CONTROL_URL (одно-хостовый стенд).
      EDGE_CONTROL_TUNNEL_URL: ${EDGE_CONTROL_TUNNEL_URL:-}
      EDGE_CONTROL_TOKEN: ${EDGE_CONTROL_TOKEN:-}
      EDGE_CREDENTIALS_RESYNC_INTERVAL_MS: ${EDGE_CREDENTIALS_RESYNC_INTERVAL_MS:-60000}
      # «Bridge Mail» (Этап M5): URL провижининг-агента почтовика (mail-provision
      # serve, рядом с mailserver). Задан — админка может заказывать ящики
      # (POST /api/v1/mail/mailboxes → агент создаёт ящик → авто-connect канала).
      # Пусто — услуга выключена. TOKEN — общий Bearer для агента.
      MAIL_PROVISION_URL: ${MAIL_PROVISION_URL:-}
      MAIL_PROVISION_TOKEN: ${MAIL_PROVISION_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ai-platform:
    build:
      context: ../..
      dockerfile: deploy/docker/ai-platform/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${AI_PLATFORM_PORT:-3006}
      AI_GRPC_PORT: ${AI_GRPC_PORT:-3106}
      AI_BACKEND_KB_URL: ${AI_BACKEND_KB_URL:-http://backend:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o-mini}
      LLM_EMBEDDING_MODEL_NAME: ${LLM_EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      AI_LLM_CONFIG: ${AI_LLM_CONFIG:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
    ports:
      - "${AI_PLATFORM_PORT:-3006}:${AI_PLATFORM_PORT:-3006}"
      - "${AI_GRPC_PORT:-3106}:${AI_GRPC_PORT:-3106}"
    depends_on:
      backend:
        condition: service_started

  integration-platform:
    build:
      context: ../..
      dockerfile: deploy/docker/integration-platform/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${INTEGRATION_PLATFORM_PORT:-3005}
      CORE_INGRESS_URL: ${CORE_INGRESS_URL:-http://backend:3000/internal/ingress/messages}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      # Входящий Telegram-драйвер (T3) и RF-first Edge-маршрут входящих (T5).
      # EDGE_INGRESS_URL пуст → прямой приём в ядро; задан → клиенты РФ (канал с
      # config.region="RF"/route_via_edge) идут через Edge Cluster.
      TELEGRAM_INBOUND_ENABLED: ${TELEGRAM_INBOUND_ENABLED:-true}
      TELEGRAM_INBOUND_POLL_TIMEOUT_SECONDS: ${TELEGRAM_INBOUND_POLL_TIMEOUT_SECONDS:-30}
      TELEGRAM_INBOUND_REFRESH_INTERVAL_MS: ${TELEGRAM_INBOUND_REFRESH_INTERVAL_MS:-30000}
      CHANNEL_SECRET_CACHE_TTL_MS: ${CHANNEL_SECRET_CACHE_TTL_MS:-60000}
      EDGE_INGRESS_URL: ${EDGE_INGRESS_URL:-}
      # Боевой профиль: false снимает mock-fallback доставки (T6).
      DELIVERY_ALLOW_MOCK_FALLBACK: ${DELIVERY_ALLOW_MOCK_FALLBACK:-true}
      EMAIL_DELIVERY_URL: ${EMAIL_DELIVERY_URL:-}
      EMAIL_DELIVERY_TOKEN: ${EMAIL_DELIVERY_TOKEN:-}
      MAX_DELIVERY_URL: ${MAX_DELIVERY_URL:-}
      MAX_ACCESS_TOKEN: ${MAX_ACCESS_TOKEN:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    ports:
      - "${INTEGRATION_PLATFORM_PORT:-3005}:${INTEGRATION_PLATFORM_PORT:-3005}"
    depends_on:
      backend:
        condition: service_started

  broadcast-platform:
    build:
      context: ../..
      dockerfile: deploy/docker/broadcast-platform/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${BROADCAST_PLATFORM_PORT:-3008}
      BROADCAST_GRPC_PORT: ${BROADCAST_GRPC_PORT:-3108}
    ports:
      - "${BROADCAST_PLATFORM_PORT:-3008}:${BROADCAST_PLATFORM_PORT:-3008}"
      - "${BROADCAST_GRPC_PORT:-3108}:${BROADCAST_GRPC_PORT:-3108}"
    depends_on:
      backend:
        condition: service_started

  notification-platform:
    build:
      context: ../..
      dockerfile: deploy/docker/notification-platform/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${NOTIFICATION_PLATFORM_PORT:-3010}
      NOTIFICATION_GRPC_PORT: ${NOTIFICATION_GRPC_PORT:-3110}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NOTIFICATION_TRIGGER_STREAM: ${NOTIFICATION_TRIGGER_STREAM:-bridge:notifications:trigger}
      NOTIFICATION_TRIGGER_GROUP: ${NOTIFICATION_TRIGGER_GROUP:-svc-notif}
      # Боевое Telegram-плечо уведомлений (G-8): задан URL → карточки менеджеру
      # форвардятся в telegram-console (SVC-TGC); пусто → recording-mock.
      SVC_TGC_NOTIFICATIONS_URL: ${SVC_TGC_NOTIFICATIONS_URL:-}
    ports:
      - "${NOTIFICATION_PLATFORM_PORT:-3010}:${NOTIFICATION_PLATFORM_PORT:-3010}"
      - "${NOTIFICATION_GRPC_PORT:-3110}:${NOTIFICATION_GRPC_PORT:-3110}"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  mobile-api:
    build:
      context: ../..
      dockerfile: deploy/docker/mobile-api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${MOBILE_API_PORT:-3015}
      # CP-7 (ТЗ §7.6): при заданном EDGE_BASE_URL mobile-api маршрутизирует
      # клиентов РФ через Edge Cluster; пусто — прямой режим (из окружения, не код).
      EDGE_BASE_URL: ${EDGE_BASE_URL:-}
    ports:
      - "${MOBILE_API_PORT:-3015}:${MOBILE_API_PORT:-3015}"
    depends_on:
      backend:
        condition: service_started

  edge-vpn-app:
    build:
      context: ../..
      dockerfile: deploy/docker/edge-gateway/Dockerfile
    restart: unless-stopped
    environment:
      EDGE_GATEWAY_MODE: app-vpn
      HOST: 0.0.0.0
      PORT: ${EDGE_VPN_APP_WSS_PORT:-3050}
      EDGE_VPN_APP_TCP_HOST: 0.0.0.0
      EDGE_VPN_APP_TCP_PORT: ${EDGE_VPN_APP_TCP_PORT:-3049}
      EDGE_VPN_APP_WSS_HOST: 0.0.0.0
      EDGE_VPN_APP_WSS_PORT: ${EDGE_VPN_APP_WSS_PORT:-3050}
      EDGE_VPN_APP_WSS_PATH: ${EDGE_VPN_APP_WSS_PATH:-/vpn}
      EDGE_VPN_BACKEND_C9_URL: ${EDGE_VPN_BACKEND_C9_URL:-http://backend:3000/internal/edge/tunnel/messages}
      EDGE_VPN_SESSION_KEY: ${EDGE_VPN_SESSION_KEY:?укажите EDGE_VPN_SESSION_KEY в .env, он должен совпадать с .env.rf}
      EDGE_VPN_APP_ID: ${EDGE_VPN_APP_ID:-app-core}
      EDGE_VPN_APP_CERT: ${EDGE_VPN_APP_CERT:?укажите EDGE_VPN_APP_CERT в .env}
      EDGE_VPN_TRUSTED_EDGE_CERTS: ${EDGE_VPN_TRUSTED_EDGE_CERTS:?укажите EDGE_VPN_TRUSTED_EDGE_CERTS в .env}
      # Единый слой (Этап 2, Q2): off — прикладной AES-GCM/mTLS снят, защиту даёт
      # AmneziaWG. Туннельный деплой ставит off (см. .env.awg.app). Дефолт on.
      EDGE_VPN_APP_CRYPTO: ${EDGE_VPN_APP_CRYPTO:-on}
      EDGE_VPN_APP_CAPACITY: ${EDGE_VPN_APP_CAPACITY:-1024}
      EDGE_VPN_APP_TCP_TLS_KEY: ${EDGE_VPN_APP_TCP_TLS_KEY:-}
      EDGE_VPN_APP_TCP_TLS_CERT: ${EDGE_VPN_APP_TCP_TLS_CERT:-}
      EDGE_VPN_APP_TCP_TLS_CA: ${EDGE_VPN_APP_TCP_TLS_CA:-}
      EDGE_VPN_APP_WSS_TLS_KEY: ${EDGE_VPN_APP_WSS_TLS_KEY:-}
      EDGE_VPN_APP_WSS_TLS_CERT: ${EDGE_VPN_APP_WSS_TLS_CERT:-}
      EDGE_VPN_APP_WSS_TLS_CA: ${EDGE_VPN_APP_WSS_TLS_CA:-}
      # App→Edge control-plane через туннель (Этап E2/MP-12). Адрес control-
      # listener'а Edge по туннельному IP (обратное направление от data-plane).
      # Пусто → релей не поднимается, backend остаётся на прямом HTTP (стенд).
      EDGE_VPN_EDGE_CONTROL_URL: ${EDGE_VPN_EDGE_CONTROL_URL:-}
      EDGE_VPN_EDGE_CONTROL_WSS_URL: ${EDGE_VPN_EDGE_CONTROL_WSS_URL:-}
      # HTTP-релей для backend (host-internal, edge-vpn-app:3052). Backend бьёт
      # сюда через EDGE_CONTROL_TUNNEL_URL, релей толкает на Edge по туннелю.
      EDGE_CONTROL_RELAY_HOST: 0.0.0.0
      EDGE_CONTROL_RELAY_PORT: ${EDGE_CONTROL_RELAY_PORT:-3052}
      EDGE_CONTROL_TOKEN: ${EDGE_CONTROL_TOKEN:-}
      # Проактивный TCP-liveness control-порта Edge (быстрый сигнал разрыва).
      EDGE_VPN_CONTROL_LIVENESS: ${EDGE_VPN_CONTROL_LIVENESS:-off}
      EDGE_VPN_CONTROL_CLIENT_TLS_CA: ${EDGE_VPN_CONTROL_CLIENT_TLS_CA:-}
    ports:
      - "${EDGE_VPN_APP_TCP_PORT:-3049}:${EDGE_VPN_APP_TCP_PORT:-3049}"
      - "${EDGE_VPN_APP_WSS_PORT:-3050}:${EDGE_VPN_APP_WSS_PORT:-3050}"
      # Публичный UDP-эндпоинт AmneziaWG-туннеля (issue #257, Этап 1). Слушает
      # awg-server, разделяющий network namespace edge-vpn-app. Когда профиль
      # tunnel выключен — порт опубликован, но никто не слушает (безвредно).
      - "${AWG_LISTEN_PORT:-51820}:${AWG_LISTEN_PORT:-51820}/udp"
    depends_on:
      backend:
        condition: service_started

  # AmneziaWG-терминатор App-стороны (issue #257, Этап 1). Поднимает awg0
  # (10.7.0.1) внутри network namespace edge-vpn-app: нода сохраняет свою
  # идентичность/DNS, а C9-RPC на 10.7.0.1:3049 идёт ВНУТРИ туннеля. Единый
  # образ deploy/docker/awg (роль задаётся переменными AWG_*). Профиль tunnel —
  # чтобы App-кластер поднимался и без туннеля.
  awg-server:
    profiles: ["tunnel"]
    build:
      context: ../..
      dockerfile: deploy/docker/awg/Dockerfile
      args:
        AWG_GO_REF: ${AWG_GO_REF:-master}
        AWG_TOOLS_REF: ${AWG_TOOLS_REF:-master}
    restart: unless-stopped
    network_mode: "service:edge-vpn-app"
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      AWG_INTERFACE: awg0
      AWG_ADDRESS: ${AWG_SERVER_ADDRESS:-10.7.0.1/24}
      AWG_LISTEN_PORT: ${AWG_LISTEN_PORT:-51820}
      AWG_MTU: ${AWG_MTU:-1380}
      AWG_PRIVATE_KEY: ${AWG_SERVER_PRIVATE_KEY:-}
      AWG_PEER_PUBLIC_KEY: ${AWG_CLIENT_PUBLIC_KEY:-}
      AWG_PEER_PRESHARED_KEY: ${AWG_PRESHARED_KEY:-}
      AWG_PEER_ALLOWED_IPS: ${AWG_CLIENT_ADDRESS_CIDR:-10.7.0.2/32}
      # Prometheus-экспортер awg (Этап 3): скрейпится в сети compose по адресу
      # ноды (общий namespace) — edge-vpn-app:${AWG_METRICS_PORT}.
      AWG_METRICS_PORT: ${AWG_METRICS_PORT:-9586}
      # S1/S2/H1–H4 — общий профиль обфускации, ОБЯЗАН совпадать с awg-client.
      # Jc/Jmin/Jmax на сервере не задаём (junk шлёт только клиент, §2 плана;
      # amneziawg-go отвергает Jc=0 — находка Этапа 0).
      AWG_S1: ${AWG_S1:-0}
      AWG_S2: ${AWG_S2:-0}
      AWG_H1: ${AWG_H1:-}
      AWG_H2: ${AWG_H2:-}
      AWG_H3: ${AWG_H3:-}
      AWG_H4: ${AWG_H4:-}
    depends_on:
      edge-vpn-app:
        condition: service_started

  fbp-engine:
    build:
      context: ../..
      dockerfile: deploy/docker/fbp-engine/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${FBP_ENGINE_PORT:-3095}
      FBP_GRPC_PORT: ${FBP_GRPC_PORT:-3105}
      FBP_BACKEND_API_URL: ${FBP_BACKEND_API_URL:-http://backend:3000}
    ports:
      - "${FBP_ENGINE_PORT:-3095}:${FBP_ENGINE_PORT:-3095}"
      - "${FBP_GRPC_PORT:-3105}:${FBP_GRPC_PORT:-3105}"
    depends_on:
      backend:
        condition: service_started

  saas-admin:
    build:
      context: ../..
      dockerfile: deploy/docker/saas-admin/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3000}
    ports:
      - "${SAAS_ADMIN_PORT:-8081}:4173"
    depends_on:
      backend:
        condition: service_started

  manager-workspace:
    build:
      context: ../..
      dockerfile: deploy/docker/manager-workspace/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3000}
    ports:
      - "${MANAGER_WORKSPACE_PORT:-8082}:4173"
    depends_on:
      backend:
        condition: service_started

  web-chat:
    build:
      context: ../..
      dockerfile: deploy/docker/web-chat/Dockerfile
    restart: unless-stopped
    environment:
      # Хостируемая страница организации /chat/<id> (W5) обращается к /api;
      # vite preview проксирует /api на ядро. Без этого адреса страница не смогла
      # бы создать сессию (W4). Для RF-контура тут может стоять адрес Edge.
      BACKEND_INTERNAL_URL: ${WEB_CHAT_BACKEND_INTERNAL_URL:-http://backend:3000}
    ports:
      - "${WEB_CHAT_PORT:-8083}:4173"

  telegram-console:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: deploy/docker/telegram-console/Dockerfile
    environment:
      TELEGRAM_CONSOLE_MODE: ${TELEGRAM_CONSOLE_MODE:-polling}
      TELEGRAM_CONSOLE_BACKEND_API_BASE_URL: ${TELEGRAM_CONSOLE_BACKEND_API_BASE_URL:-http://backend:3000/api/v1}
      TELEGRAM_CONSOLE_BOT_TOKEN: ${TELEGRAM_CONSOLE_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      MANAGER_WORKSPACE_PUBLIC_URL: ${MANAGER_WORKSPACE_PUBLIC_URL:-http://localhost:8082}
      # Приёмник проактивных карточек от SVC-NOTIF (G-8). Задайте порт (напр. 3020)
      # и SVC_TGC_NOTIFICATIONS_URL=http://telegram-console:3020 у notification-platform.
      TELEGRAM_CONSOLE_NOTIFICATIONS_PORT: ${TELEGRAM_CONSOLE_NOTIFICATIONS_PORT:-}
      TELEGRAM_CONSOLE_NOTIFICATIONS_HOST: ${TELEGRAM_CONSOLE_NOTIFICATIONS_HOST:-0.0.0.0}
    depends_on:
      backend:
        condition: service_started

volumes:
  bridge-postgres-data:
  bridge-redis-data:
