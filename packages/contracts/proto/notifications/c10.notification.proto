syntax = "proto3";

package bridge.notification.v1;

service NotificationPlatform {
  rpc ListNotifications(ListNotificationsRequest) returns (JsonResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (JsonResponse);
  rpc GetNotificationSettings(NotificationSettingsRequest) returns (JsonResponse);
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (JsonResponse);
  rpc AcceptNotificationTrigger(AcceptNotificationTriggerRequest) returns (JsonResponse);
  rpc Health(HealthRequest) returns (JsonResponse);
}

message ListNotificationsRequest {
  string contract = 1;
  string version = 2;
  string request_id = 3;
  string organization_id = 4;
  string user_id = 5;
  string status = 6;
  string category = 7;
  string cursor = 8;
  uint32 limit = 9;
}

message MarkNotificationReadRequest {
  string contract = 1;
  string version = 2;
  string request_id = 3;
  string organization_id = 4;
  string user_id = 5;
  string notification_id = 6;
}

message NotificationSettingsRequest {
  string contract = 1;
  string version = 2;
  string request_id = 3;
  string organization_id = 4;
  string user_id = 5;
}

message UpdateNotificationSettingsRequest {
  string contract = 1;
  string version = 2;
  string request_id = 3;
  string organization_id = 4;
  string user_id = 5;
  string settings_json = 6;
}

message AcceptNotificationTriggerRequest {
  string contract = 1;
  string version = 2;
  string request_id = 3;
  string payload_json = 4;
}

message HealthRequest {}

message JsonResponse {
  string json_payload = 1;
}
