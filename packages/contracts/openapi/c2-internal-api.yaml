openapi: 3.1.0
info:
  title: C2 Ingress/Egress M0 Mock
  version: 1.0.0
  description: >
    M0 mock contract between Integration Platform adapters and Communication
    Core. SVC-CORE owns C2; SVC-INT consumes it through these frozen endpoints
    until the full C1/C2 contract is expanded in later milestones.
paths:
  /internal/ingress/messages:
    post:
      summary: Adapter publishes an inbound C1 message to Communication Core.
      operationId: publishIngressMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/c2-ingress-message.schema.json
      responses:
        "202":
          description: Message accepted by the core ingress mock.
  /internal/egress/deliveries:
    post:
      summary: Communication Core sends an outbound delivery request to Adapter.
      operationId: acceptEgressDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/c2-egress-delivery.schema.json
      responses:
        "202":
          description: Delivery accepted by the adapter channel stub.
