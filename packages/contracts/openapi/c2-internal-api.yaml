openapi: 3.1.0
info:
  title: C2 Ingress/Egress Dispatch
  version: 1.0.0
  description: >
    Internal contract between Integration Platform adapters and Communication
    Core. SVC-CORE owns C2; SVC-INT consumes ingress and the channel-aware
    delivery dispatch endpoint.
paths:
  /internal/ingress/messages:
    post:
      summary: Adapter publishes an inbound C1 message to Communication Core.
      operationId: publishIngressMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/c2-ingress-message.schema.json
      responses:
        "202":
          description: Message accepted by the core ingress mock.
  /internal/delivery/dispatch:
    post:
      summary: Communication Core sends an outbound delivery request to channel-aware dispatch.
      operationId: dispatchEgressDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/c2-egress-delivery.schema.json
      responses:
        "202":
          description: Delivery accepted by the Integration Platform dispatch path.
