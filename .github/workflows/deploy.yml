# Ручной покомпонентный деплой на стенды.
#
# Зачем: раскатывать только то, что реально менялось, а не весь кластер.
# Схема: раннер GitHub собирает образы → пушит в GHCR → стенд их ТЯНЕТ.
# Сборка на стенде запрещена (RF edge ~908 МБ RAM уходит в OOM), см.
# deploy/docker/web-chat-edge/Dockerfile и CLAUDE.md.
#
# Состав компонентов и стендов описан в deploy/components.json — единственный
# источник правды. Новый сервис → правится он, а не этот файл.
name: Deploy (ручной)

run-name: "Deploy: ${{ inputs.components }} → ${{ inputs.target }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Стенд"
        required: true
        type: choice
        options:
          - app
          - edge-rf
      components:
        description: 'Компоненты через запятую (напр. "backend,web-chat") или "all"'
        required: true
        type: string
      ref:
        description: "Ветка / тег / SHA (пусто = ветка, из которой запущен workflow)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Только показать план: не собирать и не трогать стенд"
        required: false
        type: boolean
        default: false

# Два одновременных деплоя на один стенд подрались бы за git checkout и env-файл.
# Разные стенды при этом деплоятся параллельно. Идущий деплой не отменяем.
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: План
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      images: ${{ steps.plan.outputs.images }}
      services: ${{ steps.plan.outputs.services }}
      profiles: ${{ steps.plan.outputs.profiles }}
      tag_csv: ${{ steps.plan.outputs.tag_csv }}
      host_secret: ${{ steps.plan.outputs.host_secret }}
      known_hosts_secret: ${{ steps.plan.outputs.known_hosts_secret }}
      user: ${{ steps.plan.outputs.user }}
      workdir: ${{ steps.plan.outputs.workdir }}
      compose_file: ${{ steps.plan.outputs.compose_file }}
      env_file: ${{ steps.plan.outputs.env_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Составить план
        id: plan
        env:
          TARGET: ${{ inputs.target }}
          COMPONENTS: ${{ inputs.components }}
          # Пины upstream для образа awg (по умолчанию master, см. components.json).
          AWG_GO_REF: ${{ vars.AWG_GO_REF || 'master' }}
          AWG_TOOLS_REF: ${{ vars.AWG_TOOLS_REF || 'master' }}
        run: node .github/scripts/deploy-plan.js

  build:
    name: Сборка ${{ matrix.image }}
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.plan.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить
        uses: docker/build-push-action@v6
        with:
          # Контекст — весь монорепозиторий: npm workspaces требуют package.json
          # всех воркспейсов (см. комментарии в Dockerfile-ах).
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/rumaster/bridge/${{ matrix.image }}:${{ needs.plan.outputs.sha }}
          build-args: ${{ matrix.build_args }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Деплой на ${{ inputs.target }}
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets[needs.plan.outputs.host_secret] }}
      SSH_USER: ${{ needs.plan.outputs.user }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Настроить SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets[needs.plan.outputs.known_hosts_secret] }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::Не задан секрет DEPLOY_SSH_KEY (см. CLAUDE.md, «Подготовка стенда»)"
            exit 1
          fi
          if [ -z "${KNOWN_HOSTS:-}" ]; then
            echo "::error::Не задан секрет ${{ needs.plan.outputs.known_hosts_secret }} — ключ хоста не запинен"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Токен уходит на стенд ТОЛЬКО через stdin: в argv он был бы виден в `ps`.
      # Это эфемерный GITHUB_TOKEN этого запуска, а не долгоживущий PAT; в конце
      # джобы делаем logout, чтобы не оставлять его в ~/.docker/config.json.
      - name: Login стенда в GHCR
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' \
            | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "$SSH_USER@$SSH_HOST" \
                'docker login ghcr.io -u ${{ github.actor }} --password-stdin'

      # Кавычки вокруг аргументов — ЧАСТЬ строки, которую видит удалённый шелл.
      # ssh не передаёт argv: он склеивает аргументы через пробел, и удалённый
      # шелл разбирает их заново. Без кавычек пустой аргумент (профили) просто
      # исчезает, а следующие сдвигаются на позицию влево.
      - name: Деплой
        env:
          WORKDIR: ${{ needs.plan.outputs.workdir }}
          COMPOSE_FILE: ${{ needs.plan.outputs.compose_file }}
          ENV_FILE: ${{ needs.plan.outputs.env_file }}
          SHA: ${{ needs.plan.outputs.sha }}
          TAG_CSV: ${{ needs.plan.outputs.tag_csv }}
          PROFILES: ${{ needs.plan.outputs.profiles }}
          SERVICES: ${{ needs.plan.outputs.services }}
        run: |
          set -euo pipefail
          cat deploy/stand/remote-common.sh deploy/stand/remote-deploy.sh \
            | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "$SSH_USER@$SSH_HOST" \
                "bash -s -- '$WORKDIR' '$COMPOSE_FILE' '$ENV_FILE' '$SHA' '$TAG_CSV' '$PROFILES' '$SERVICES'"

      - name: Logout стенда из GHCR
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'docker logout ghcr.io' || true
