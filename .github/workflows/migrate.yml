# Ручной прогон миграций БД на стенде.
#
# Отдельно от deploy.yml намеренно: миграция — это изменение схемы БД, а не
# перезапуск контейнера. Её порядок относительно деплоя кода выбирает человек
# (обычно: аддитивная миграция → деплой кода; см. CLAUDE.md).
#
# Схема та же, что у deploy.yml: образ db-tools собирается на раннере, пушится в
# GHCR, стенд его тянет и прогоняет одноразовой джобой `compose run --rm`.
name: Миграции БД (ручной)

run-name: "Миграции: ${{ inputs.direction }} → ${{ inputs.target }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Стенд (app → схема app, edge-rf → схема rf)"
        required: true
        type: choice
        options:
          - app
          - edge-rf
      direction:
        description: "Направление. down откатывает РОВНО ОДНУ последнюю миграцию"
        required: true
        type: choice
        default: up
        options:
          - up
          - down
      ref:
        description: "Ветка / тег / SHA (пусто = ветка, из которой запущен workflow)"
        required: false
        type: string
        default: ""
      confirm_down:
        description: 'Подтверждение для down: впишите имя стенда ("app" или "edge-rf")'
        required: false
        type: string
        default: ""
      dry_run:
        description: "Только показать план: не собирать и не трогать стенд"
        required: false
        type: boolean
        default: false

# Миграции и деплой того же стенда не должны идти одновременно: обе операции
# двигают git checkout и env-файл стенда. Группа общая с deploy.yml.
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: План
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      images: ${{ steps.plan.outputs.images }}
      tag_csv: ${{ steps.plan.outputs.tag_csv }}
      host_secret: ${{ steps.plan.outputs.host_secret }}
      known_hosts_secret: ${{ steps.plan.outputs.known_hosts_secret }}
      user: ${{ steps.plan.outputs.user }}
      workdir: ${{ steps.plan.outputs.workdir }}
      compose_file: ${{ steps.plan.outputs.compose_file }}
      env_file: ${{ steps.plan.outputs.env_file }}
      migrate_service: ${{ steps.plan.outputs.migrate_service }}
      migrate_target: ${{ steps.plan.outputs.migrate_target }}
    steps:
      # Откат схемы необратим для данных в удаляемых столбцах/таблицах, поэтому
      # требуем осознанный ввод имени стенда, а не «галочку по привычке».
      - name: Проверить подтверждение отката
        if: ${{ inputs.direction == 'down' }}
        run: |
          if [ '${{ inputs.confirm_down }}' != '${{ inputs.target }}' ]; then
            echo "::error::Откат down на «${{ inputs.target }}» требует вписать имя стенда в confirm_down. Получено: «${{ inputs.confirm_down }}»"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Составить план
        id: plan
        env:
          TARGET: ${{ inputs.target }}
          COMPONENTS: __migrate__
        run: node .github/scripts/deploy-plan.js

  build:
    name: Сборка db-tools
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/rumaster/bridge/${{ matrix.image }}:${{ needs.plan.outputs.sha }}
          build-args: ${{ matrix.build_args }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  migrate:
    name: Миграции на ${{ inputs.target }}
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets[needs.plan.outputs.host_secret] }}
      SSH_USER: ${{ needs.plan.outputs.user }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Настроить SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets[needs.plan.outputs.known_hosts_secret] }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::Не задан секрет DEPLOY_SSH_KEY (см. CLAUDE.md, «Подготовка стенда»)"
            exit 1
          fi
          if [ -z "${KNOWN_HOSTS:-}" ]; then
            echo "::error::Не задан секрет ${{ needs.plan.outputs.known_hosts_secret }} — ключ хоста не запинен"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Login стенда в GHCR
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' \
            | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "$SSH_USER@$SSH_HOST" \
                'docker login ghcr.io -u ${{ github.actor }} --password-stdin'

      - name: Прогнать миграции
        run: |
          set -euo pipefail
          cat deploy/stand/remote-common.sh deploy/stand/remote-migrate.sh \
            | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                "$SSH_USER@$SSH_HOST" 'bash -s' -- \
                '${{ needs.plan.outputs.workdir }}' \
                '${{ needs.plan.outputs.compose_file }}' \
                '${{ needs.plan.outputs.env_file }}' \
                '${{ needs.plan.outputs.sha }}' \
                '${{ needs.plan.outputs.tag_csv }}' \
                '${{ needs.plan.outputs.migrate_service }}' \
                '${{ inputs.direction }}' \
                '${{ needs.plan.outputs.migrate_target }}'

      - name: Logout стенда из GHCR
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'docker logout ghcr.io' || true
